version: '3.8'

services:
  db:
    image: postgres:17
    container_name: adat_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leidy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - adat_network

  web:
    build: .
    container_name: adat_app
    ports:
      - "80:5002"
    env_file:
      - .env
    environment:
      # For local development, point to the Postgres container
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/leidy
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=mi_secreto
    volumes:
      - .:/app
      - ./instance:/app/instance
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - adat_network

networks:
  adat_network:
    driver: bridge

volumes:
  postgres_data:
