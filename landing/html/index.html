<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKILA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #e2e8f0; /* bg-gray-200 */
    }
    .page-header {
      min-height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1497294815431-9365093b7331?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mask {
      position: absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
    }
    .card {
      border-radius: 1rem;
      overflow: hidden;
      z-index: 10;
    }
    .card-header-custom {
      background: linear-gradient(90deg, #3a7bd5, #00d2ff);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 1rem;
      padding: 2rem 1rem;
      text-align: center;
      color: white;
    }
    .btn-akila {
      width: 75%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <span class="mask"></span>
    <div class="container position-relative text-center">
      <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-header-custom">
          <div style="text-align: center;">
            <a href="https://akila.work/static/assets/img/logorosa.png" target="_blank">
              <img src="https://akila.work/static/assets/img/logorosa.png" alt="Logotipo AKILA" style="width: 100%; max-width: 200px; height: auto;">
            </a>
          </div>
          <div class="row mt-3">
            <p class="mb-0 text-white text-center">
              Herramienta para apoyar el aprendizaje de las habilidades de pensamiento computacional
            </p>
          </div>
          <h4 class="mt-3 mb-3">AKILA ha cambiado de sitio</h4>
          <p>Para continuar, haz clic en el botón para ir al nuevo sitio.</p>
          <a href="https://akila.work/" class="btn btn-light btn-akila">Ir a AKILA</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-white py-3" style="position: absolute; bottom: 0; width: 100%;">
    © <span class="fw-bold">Universidad del Valle</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
